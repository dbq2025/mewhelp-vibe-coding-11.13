[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
recursive_version_locations = false

# NOTE: keep this file ASCII-only -- alembic reads it with the system locale
# encoding (GBK on Windows) and non-ASCII bytes crash the parser.
# The DB URL is NOT configured here: alembic/env.py reads it from
# app.core.config so that app and migrations always target the same database.
sqlalchemy.url =
