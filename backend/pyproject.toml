[project]
name = "ecom-copilot"
version = "0.1.0"
description = "电商智能客服 Agent 服务（FastAPI + LangGraph + PostgreSQL/pgvector）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3.6,<1.0",
    "structlog>=24.4,<26.0",
    "pyjwt>=2.10,<3.0",
    "httpx>=0.28,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # 测试里允许 assert
    "B008",  # FastAPI 的 Depends() 默认值是惯用写法
    "RUF001", # 中文全角标点在文案里正常
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S311", "S105"]
# Alembic 自动生成的迁移不做风格改造，避免每次 autogenerate 都要手工重排
"alembic/versions/*" = ["E501", "I001", "UP007", "UP035"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = []

[[tool.mypy.overrides]]
module = ["pgvector.*", "structlog.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
